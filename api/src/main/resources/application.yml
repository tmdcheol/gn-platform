spring:
  application:
    name: api
  datasource:
    url: jdbc:h2:file:./data/gnplatform
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

app:
  admin:
    username: ${ADMIN_USERNAME}
    password-hash: ${ADMIN_PASSWORD_HASH}   # BCrypt 해시. 평문 금지
  cors:
    allowed-origins:
      - http://localhost:3000
